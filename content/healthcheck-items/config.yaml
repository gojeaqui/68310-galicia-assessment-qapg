# Categories will be listed in the
# report based of their order in this
# file.
#
# If a category has no item files associated with it,
# then it will be skipped completely.
categories:
  Infrastructure:
    text: "Infrastructure"
    short_text: "Infra"
  Platform:
    text: "Platform"
    short_text: "Platform"
  appdev:
    text: "Application Development"
    short_text: 'App Dev'
  virtualization:
    text: "Openshift Virtualization"
    short_text: 'OCP virt'
  security:
    text: "Security"
    short_text: "Security"
  operation_ready:
    text: "Organizational Readiness"
    short_text: "Organizational Readines"
skip_statuses:
- 'not_applicable'
- 'tbe'
- 'no_change'
statuses:
  changes_required:
    color: '#FF0000'
    text: 'Changes Required'
    description: 'Indicates Changes Required for system stability, subscription compliance, or other reason.'
  fail:
    color: '#FF0000'
    text: 'Changes Required'
    description: 'Indicates Changes Required for system stability, subscription compliance, or other reason.'
  changes_recommended:
    color: '#FEFE20'
    text: 'Changes Recommended'
    description: 'Indicates Changes Recommended to align with recommended practices, but not urgently required'
  na: 
    color: '#A6B9BF'
    text: 'N/A'
    description: 'No advise given on line item.  For line items which are data-only to provide context.'
  not_applicable: 
    color: '#A6B9BF'
    text: 'N/A'
    description: 'No advise given on line item.  For line items which are data-only to provide context.'
  advisory:
    color: '#80E5FF'
    text: 'Advisory'
    description: 'No change required or recommended, but additional information provided.'
  pass:
    color: '#00FF00'
    text: 'No Change'
    description: 'No change required.  In alignment with recommended practices.' 
  no_change:
    color: '#00FF00'
    text: 'No Change'
    description: 'No change required.  In alignment with recommended practices.' 
  tbe:
    color: '#FFFFFF'
    text: 'To Be Evaluated'
    description: 'Not yet evaluated.  Will appear only in draft copies.'  
tags: 
  self_managed: True
  managed: false
  rosa: false
  aro: false
  aws: false
  azure: false
  bare_metal: false
  vmware: false
  oracle: false
skip_summary: false